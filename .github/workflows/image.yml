# Builds the HireOps image on every push to main and publishes it to GitHub Container Registry.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write    # allows pushing to ghcr.io
  id-token: write    # lets the workflow prove its identity to Sigstore for keyless signing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Smoke test the image
        run: docker run --rm ghcr.io/${{ github.repository }}:${{ github.sha }} samples/job.txt --resume samples/resume.md --no-ai
      # Trivy looks inside the image for packages with known security holes (CVEs)
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0   # the scanner; Dependabot will keep this version current
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}   # the image this run just built
          format: table               # print a readable table in the log
          severity: CRITICAL,HIGH     # only the serious ones
          ignore-unfixed: true        # skip holes that have no fix released yet (nothing you can do about them)
          exit-code: "1"              # "1" so new holes fail the build

      # SBOM = the full ingredients list of the image: every Linux and Python package with its version
      - name: Generate an SBOM with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: spdx-json           # SPDX = a standard SBOM format other tools can read
          output: sbom.spdx.json      # write it to this file instead of the log
          exit-code: "0"              # making an SBOM never fails the build
      # Keep the SBOM with the run so you (or an auditor) can download it later
      - name: Keep the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90
            # cosign signs container images; keyless = GitHub's identity instead of a stored key
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      # Sign the exact image this run built (by digest, so a re-tag can't fool it)
      - name: Sign the image
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
      # Attach the SBOM to the signed image, so the ingredients list travels with it
      - name: Attach the SBOM as a signed attestation
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
      # Prove it worked: verify the signature came from THIS repo's workflow
      - name: Verify the signature
        run: |
          cosign verify ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }} \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com